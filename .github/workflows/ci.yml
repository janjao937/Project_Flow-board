name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm run install:all
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run install:all
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t flowboard-api:ci .
      - name: Build web image
        run: docker build -f docker/Dockerfile.web -t flowboard-web:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run install:all
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
